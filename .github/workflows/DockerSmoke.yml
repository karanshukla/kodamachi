name: Docker Smoke Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # Pinned so a nuclei release can't change this job with no commit to bisect.
  NUCLEI_VERSION: v3.11.1

jobs:
  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create CI secrets
        run: |
          printf 'OAUTH_TOKEN_SECRET=%s\nCOOKIE_SECRET=%s\n' \
            "$(openssl rand -hex 32)" \
            "$(openssl rand -hex 32)" > docker/.env

      - name: Build images
        run: docker compose -f docker/docker-compose.yml build

      - name: Start services
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f docker/docker-compose.yml ps -q postgres)" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "healthy" ]; then
              echo "Postgres is healthy"
              break
            fi
            echo "Waiting for postgres ($i/30): $STATUS"
            sleep 3
          done

      - name: Wait for remaining services to stabilise
        run: sleep 30

      # "Exit" alone misses a crash loop: restart: unless-stopped shows "Restarting (1)".
      - name: Check no containers have crashed
        run: |
          BAD=$(docker compose -f docker/docker-compose.yml ps -a \
            --format '{{.Name}}\t{{.State}}\t{{.Status}}' \
            | grep -iE '\b(exit|restarting|dead)' || true)
          if [ -n "$BAD" ]; then
            echo "The following containers are not running cleanly:"
            echo "$BAD"
            docker compose -f docker/docker-compose.yml logs --tail=50
            exit 1
          fi
          echo "All containers are running"

      # The public smoke tests don't touch the API; hit the server directly, with curl -f
      # so a 5xx fails.
      - name: Smoke test — server API on the compose network
        run: |
          docker run --rm --network docker_default curlimages/curl:latest \
            -fsS --retry 5 --retry-delay 3 --retry-connrefused \
            http://server:3000/client-metadata.json > /dev/null
          echo "server:3000/client-metadata.json → OK"

      # /robots.txt is in the Anubis ALLOW list, so no PoW challenge. X-Real-Ip is required
      # by Anubis when use-remote-address is false; production's load balancer sets it.
      - name: Smoke test — frontend via Anubis (port 8080)
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-Real-Ip: 127.0.0.1" \
            --retry 5 --retry-delay 3 --retry-connrefused \
            http://localhost:8080/robots.txt)
          [ "$STATUS" != "000" ] || { echo "No response on port 8080"; exit 1; }
          echo "Port 8080 → HTTP $STATUS"

      - name: Smoke test — redirector (port 8081)
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-redirs 0 --retry 5 --retry-delay 3 --retry-connrefused \
            http://localhost:8081/)
          [ "$STATUS" != "000" ] || { echo "No response on port 8081"; exit 1; }
          echo "Port 8081 → HTTP $STATUS"

      - name: Smoke test — navyfragen.app redirects to kodamachi.app (port 8082)
        run: |
          read -r STATUS LOCATION < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' \
            -H "Host: navyfragen.app" --max-redirs 0 \
            --retry 5 --retry-delay 3 --retry-connrefused \
            "http://localhost:8082/profile/alice.bsky.social?ref=post")
          [ "$STATUS" = "308" ] || { echo "Expected 308, got $STATUS"; exit 1; }
          [ "$LOCATION" = "https://kodamachi.app/profile/alice.bsky.social?ref=post" ] \
            || { echo "Wrong target: $LOCATION"; exit 1; }
          echo "navyfragen.app → $LOCATION"

      - name: Smoke test — kodamachi.app is served, not redirected (port 8082)
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Host: kodamachi.app" --max-redirs 0 \
            http://localhost:8082/robots.txt)
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; exit 1; }
          echo "kodamachi.app → HTTP $STATUS"

      # The ~5900 templates are cloned anonymously from GitHub; caching stops rate-limit
      # blips failing the job. The key rolls weekly to pick up new templates.
      - name: Key the Nuclei template cache by week
        id: nuclei-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Nuclei templates
        uses: actions/cache@v4
        with:
          path: /tmp/nuclei-templates
          key: nuclei-templates-${{ env.NUCLEI_VERSION }}-${{ steps.nuclei-week.outputs.week }}

      - name: Run Nuclei security scan
        run: |
          mkdir -p /tmp/nuclei-out /tmp/nuclei-templates
          chmod 777 /tmp/nuclei-out /tmp/nuclei-templates

          # A failed template download makes nuclei exit non-zero like a real finding; retry.
          for attempt in 1 2 3; do
            # Nuclei appends to -o; drop partial output from a failed attempt.
            rm -f /tmp/nuclei-out/findings.txt
            if docker run --rm \
              --network docker_default \
              -v /tmp/nuclei-out:/output \
              -v /tmp/nuclei-templates:/root/nuclei-templates \
              "projectdiscovery/nuclei:$NUCLEI_VERSION" \
              -u http://caddy \
              -exclude-tags intrusive,dos,fuzzing,brute-force,token-spray \
              -severity medium,high,critical \
              -no-interactsh \
              -timeout 10 \
              -retries 1 \
              -o /output/findings.txt
            then
              SCANNED=1
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Nuclei attempt $attempt did not complete; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

          if [ -z "${SCANNED:-}" ]; then
            echo "Nuclei could not complete a scan in 3 attempts — failing rather than"
            echo "reporting an unscanned stack as clean."
            exit 1
          fi

          if [ -s /tmp/nuclei-out/findings.txt ]; then
            echo "Nuclei found medium+ severity security issues:"
            cat /tmp/nuclei-out/findings.txt
            exit 1
          fi
          echo "Nuclei: no medium+ severity findings"

      # The scan container runs as root, so actions/cache's tar can't read the template
      # tree and silently never saves. Hand it back before the post-job cache step;
      # always() so a run with findings still saves.
      - name: Hand the Nuclei templates back to the runner
        if: always()
        run: |
          # always() also fires when the job failed before the scan created this.
          if [ -d /tmp/nuclei-templates ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/nuclei-templates
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=100
