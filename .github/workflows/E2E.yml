name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# The suite mutates shared state on one live Bluesky test account, so runs must
# not overlap. The lock is taken inside the job (first step), not here: a
# concurrency group keeps one pending run and cancels the rest, a cancelled run
# never reports the required check, and the PR is left blocked (2026-08-30: four
# E2E runs cancelled this way). This group only sheds runs superseded by a newer
# push to the same ref. cancel-in-progress stays false because specs restore
# mutated state in teardown, which a cancel skips.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Includes time queueing for the shared account.
    timeout-minutes: 60

    permissions:
      contents: read
      actions: read

    steps:
      # FIFO by run_number. Counts not-yet-started runs too, or a lower-numbered
      # queued run would overtake this one and put two suites on the account.
      - name: Wait for the shared Bluesky test account
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          deadline=$(( SECONDS + 1800 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            ahead=$(gh api "repos/$REPO/actions/workflows/E2E.yml/runs?per_page=100" \
              | jq --argjson me "$RUN_NUMBER" \
                  '[.workflow_runs[]
                    | select(.status != "completed" and .run_number < $me)]
                   | length') || ahead=unavailable
            if [ "$ahead" = "0" ]; then
              echo "Shared account is free, starting the suite."
              exit 0
            fi
            echo "Waiting on $ahead older E2E run(s)."
            sleep 20
          done
          echo "Timed out waiting for the shared test account." >&2
          exit 1

      - uses: actions/checkout@v4

      # Playwright's runner fails under Bun (opaque BuildMessage {} on inline
      # `type` imports) and Bun is unsupported there. See docs/testing-notes.md.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Create docker/.env with generated secrets
        run: |
          printf 'OAUTH_TOKEN_SECRET=%s\nCOOKIE_SECRET=%s\n' \
            "$(openssl rand -hex 32)" \
            "$(openssl rand -hex 32)" > docker/.env

      - name: Build Docker images (e2e overlay)
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.e2e.yml \
            build
        env:
          E2E_PDS_URL: ${{ secrets.E2E_PDS_URL }}

      - name: Start services
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.e2e.yml \
            up -d
        env:
          E2E_PDS_URL: ${{ secrets.E2E_PDS_URL }}

      - name: Wait for postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f docker/docker-compose.yml ps -q postgres)" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "healthy" ]; then
              echo "Postgres is healthy"
              break
            fi
            echo "Waiting for postgres ($i/30): $STATUS"
            sleep 3
          done

      - name: Wait for remaining services to stabilise
        run: sleep 30

      - name: Check no containers have crashed
        run: |
          EXITED=$(docker compose -f docker/docker-compose.yml ps -a | grep -iE '\bExit' || true)
          if [ -n "$EXITED" ]; then
            echo "The following containers exited unexpectedly:"
            echo "$EXITED"
            docker compose -f docker/docker-compose.yml logs --tail=50
            exit 1
          fi
          echo "All containers are running"

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          E2E_HANDLE: ${{ secrets.E2E_HANDLE }}
          E2E_APP_PASSWORD: ${{ secrets.E2E_APP_PASSWORD }}
          PLAYWRIGHT_BASE_URL: http://localhost:8090

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.e2e.yml \
            logs --tail=100
