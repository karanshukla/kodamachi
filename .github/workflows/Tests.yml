name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

# Cancels superseded PR runs: seven jobs per run would starve the queue. Main is exempt, since its runs are the merge-status record.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No setup-node: with Node on PATH, `bun run` hands node-shebang binaries (vite,
      # vitest, tsc) to it, hence `bunx --bun` everywhere. The probe below asserts the runtime.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated brand static assets are current
        working-directory: client
        run: |
          bun run render:brand-assets
          git diff --exit-code public/sitemap.xml public/client-metadata.json

      - name: Probe Vite dev server under Bun
        working-directory: client
        run: |
          {
            echo "## Client Bun runtime probe"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # Only coverage of the vite dev server (build and vitest skip it). Capture via a
          # file: `$(...)` hangs if the server fails to release its socket.
          set +e
          timeout --signal=TERM --kill-after=15s 120s bun run probe:bun \
            > "$RUNNER_TEMP/probe.log" 2>&1
          probe_exit=$?
          set -e
          probe_out=$(cat "$RUNNER_TEMP/probe.log")
          echo "$probe_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-vite-dev-server</code></summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -eq 124 ] || [ "$probe_exit" -eq 137 ]; then
            echo "::error::Vite dev server probe exceeded its 120s budget"
            exit 1
          fi
          if [ "$probe_exit" -ne 0 ] || ! echo "$probe_out" | grep -q 'OK bun='; then
            echo "::error::Vite dev server did not pass under Bun"
            exit 1
          fi

      - name: Build under Bun
        run: cd client && bun run build

      - name: Check the es locale ships as its own chunk
        run: cd client && bun run check:locale-chunking

      # Also type-checks tests (tsconfig.test.json); vitest strips types.
      - name: Typecheck client, tests included
        run: cd client && bun run typecheck

      - name: Run client tests with coverage
        run: cd client && bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage-report
          path: client/coverage/
          retention-days: 14

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: client

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: client/coverage/lcov.info
          flag-name: client
          base-path: client
          parallel: true
          coverage-threshold-percent: 97

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # bun blocks dep lifecycle scripts by default; sharp needs its build.
        run: bun install --frozen-lockfile

      # Nothing else type-checks the server: bun and bun test strip types.
      - name: Typecheck server, tests included
        run: cd server && bun run typecheck

      - name: Probe SQLite data layer + OAuth handle resolution under Bun
        id: probe
        working-directory: server
        env:
          # createDb's SQLite branch needs these at load time (mirrors test-bootstrap.js).
          NODE_ENV: test
          OAUTH_TOKEN_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          {
            echo "## Bun runtime probes"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # bun:sqlite adapter bridged onto Kysely. Gate on the exit code and require "OK"
          # (the dotenv banner can prepend lines).
          set +e
          sqlite_out=$(bun -e "import('./src/database/db.ts').then(async ({createDb,migrateToLatest})=>{const db=await createDb(':memory:');await migrateToLatest(db);await db.insertInto('message').values({tid:'t1',message:'hi',createdAt:'2024-01-01',recipient:'did:web:x'}).execute();const row=await db.selectFrom('message').selectAll().executeTakeFirstOrThrow();await db.destroy();if(row.tid!=='t1')throw new Error('row mismatch '+JSON.stringify(row));console.log('OK',JSON.stringify(row))}).catch(e=>{console.error('FAIL',e.message);process.exit(1)})" 2>&1)
          sqlite_exit=$?
          set -e
          echo "$sqlite_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-sqlite-data-layer</code> (#263)</summary>"
            echo ""
            echo '```'
            echo "$sqlite_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$sqlite_exit" -ne 0 ] || ! echo "$sqlite_out" | grep -q 'OK '; then
            echo "::error::SQLite data layer did not pass under Bun (regression of #263)"
            exit 1
          fi

          # OAuth handle resolution has no other CI coverage (E2E uses an app password). Its Bun
          # failure mode is silent (undefined), so assert a did: string comes back.
          set +e
          probe_out=$(bun -e "
            import { AtprotoHandleResolverNode } from '@atproto/oauth-client-node';
            const did = await new AtprotoHandleResolverNode({}).resolve('bsky.app');
            if (typeof did !== 'string' || !did.startsWith('did:')) {
              console.error('FAIL handle resolved to', JSON.stringify(did));
              process.exit(1);
            }
            console.log('OK oauth-handle-resolution bsky.app ->', did);
          " 2>&1)
          probe_exit=$?
          set -e
          echo "$probe_out"
          {
            echo "<details><summary><code>oauth-handle-resolution</code> (patched fetch-node, #270)</summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -ne 0 ]; then
            echo "::error::OAuth handle resolution failed under Bun — see bluesky-social/atproto#3511"
            exit 1
          fi

      # Gates on test results: server/bunfig.toml sets no coverageThreshold (Bun exits 1
      # below 100% regardless, which hid failures). `pipefail` keeps tee from masking the exit code.
      - name: Run server tests with coverage
        shell: bash
        run: |
          set -o pipefail
          cd server && bun run test:coverage 2>&1 | tee /tmp/server-test-output.txt

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/server-test-output.txt', 'utf8');

            // Bun's text reporter outputs a table starting with a "---|---" separator
            // line, the same shape c8 produced — the regex is unchanged.
            const coverageIdx = output.search(/^-+\|/m);
            if (coverageIdx === -1) {
              console.log('No coverage data found in output');
              console.log('--- last 800 chars ---');
              console.log(output.slice(-800));
              return;
            }

            const coverageText = output.slice(coverageIdx).trim();

            const marker = '<!-- server-coverage-comment -->';
            const body = `${marker}\n### Server Test Coverage (bun:test — lines & functions; Bun reports no branch data)\n\n\`\`\`\n${coverageText}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: server/coverage/lcov.info
          flag-name: server
          base-path: server
          parallel: true
          # Bun's lcov has no branch records, so branch% reads 0/N/A. coverageThreshold is
          # unusable (see server/bunfig.toml), so this is the coverage gate.
          coverage-threshold-percent: 97

  opengraph-tests:
    name: OpenGraph Service (Go) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: opengraph-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opengraph-service/go.mod
          cache: true
          cache-dependency-path: opengraph-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify generated brand.go is current
        run: |
          go generate ./internal/...
          git diff --exit-code internal/shim/brand.go

      - name: Vet
        run: go vet ./...

      - name: Run tests
        # CGO is required for the race detector; setup-go enables it on linux.
        run: go test -race -count=1 ./...

  html-to-image-tests:
    name: HTML-to-Image Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: html-to-image

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Unit tests use fakes, so skip the ~150MB Chrome download; the probe installs it.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile

      # Bun-runtime canary: Chromium child_process.spawn and the puppeteer CDP WebSocket,
      # end-to-end (launch, newPage, goto, evaluate, screenshot, close).
      - name: Probe Puppeteer under Bun
        id: probe
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
        run: |
          # bunx, not npx, so this job needs no Node.
          bunx puppeteer browsers install chrome

          {
            echo "## Bun puppeteer probe"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # Checked-in file to avoid bash quote escaping; imports the real CHROMIUM_LAUNCH_ARGS.
          set +e
          probe_out=$(bun probe-bun-puppeteer.mjs 2>&1)
          probe_exit=$?
          set -e
          echo "$probe_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-puppeteer-probe</code> (#314 regression canary)</summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -ne 0 ] || ! echo "$probe_out" | grep -q '^OK '; then
            echo "::error::Puppeteer did not pass under Bun (regression of #314)"
            exit 1
          fi

      - name: Run tests
        run: bun test app.test.js

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tests that carry a rule must stay linked from the code; a rename breaks the link silently.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned by boundary pairs: it once silently missed a wrapped @see.
      - name: Test the checker
        run: bun run test:doc-links

      - name: Check doc links resolve
        run: bun run check:doc-links

  bot-policy:
    name: Anubis Bot Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The policy once allowed /site.webmanifest after the PWA plugin moved to
    # /manifest.webmanifest; this reads the policy and the client build together.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the policy allows what the client ships
        run: bun run test:bot-policy

  root-typecheck:
    name: E2E & Script Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Not in E2E.yml: that job waits on the shared-account lock; type errors in e2e/
    # and scripts/ should fail fast here.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck e2e specs and repo scripts
        run: bun run typecheck

  coveralls-finish:
    name: Coveralls Finish
    needs: [client-tests, server-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "client,server"
          coverage-threshold-percent: 97

  check-i18n:
    name: Check i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Stops bare UI string literals creeping back outside client/src/lib/i18n/en.ts.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test the checker
        run: bun run test:i18n

      - name: Check for bare prose string literals
        run: bun run check:i18n
