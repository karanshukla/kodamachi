[run]
# Backstop for `bunx --bun`: stops node-shebang binaries running on Node.
bun = true

# Bun ignores coverage-ignore annotations, reports line + function coverage only, and
# enforces coverageThreshold per file (a threshold here would turn the CI step red on
# one file and force continue-on-error). So none is set and per-file exclusion lives
# in coveragePathIgnorePatterns. Rationale: docs/testing-notes.md "Coverage under Bun".

[test]
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Globs relative to this file; each suppressed site is catalogued in docs/testing-notes.md.
coveragePathIgnorePatterns = [
  "src/lexicon/**",       # auto-generated from AT Protocol lexicons
  "src/index.ts",         # Hono app + Bun.serve boot + process signal handlers
  "src/lib/assert-fetch-node-patch.ts",  # applied via patchedDependencies; covers the @atproto-labs fetch-node patch surface
  "src/lib/assert-production-bind-host.ts",  # production-only boot guard; the throw branch can't fire under NODE_ENV=test
  "src/auth/client.ts",   # AT Protocol OAuth wiring
  "src/auth/storage.ts",
  "src/auth/session.ts",
  "src/auth/e2e-agent-store.ts",          # in-memory Map for E2E agents; trivial
  "src/database/**",                      # Kysely schema, migrations, and the bun:sqlite dialect adapter; the Bun `bun:sqlite` branch is exercised by the CI runtime canary
  "src/lib/id-resolver.ts",               # AT Protocol DID/handle resolver (requires live network)
  "src/lib/env.ts",                       # bootstrapped before tests via test-bootstrap.js
  "src/hono/session-middleware.ts",       # signed-cookie session I/O; covered by the E2E suite (real cookies), not unit tests
  "src/hono/e2e-auth-routes.ts",          # E2E-only login; makes live network calls, exercised by the Playwright overlay
  "src/tests/helpers/**",                 # test infrastructure (session-injection wrapper), not production code
  "src/scripts/**",                       # one-off admin scripts (publish-lexicons etc.)
]
