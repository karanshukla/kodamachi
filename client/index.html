<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <meta property="og:title" content="%APP_NAME%" />
  <meta property="og:description"
    content="Anonymous questions, answered on Bluesky. Share one link, collect questions from anyone, and post your answers straight to your feed." />
  <meta property="og:url" content="https://%APP_DOMAIN%" />
  <meta property="og:image" content="https://%APP_DOMAIN%/og.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- "default" follows the color scheme; black-translucent forces white text, unreadable on the light header. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1428" />
  <title>%APP_NAME%</title>
  <!-- The manifest link is injected by vite-plugin-pwa. -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "%APP_NAME%",
        "description": "Anonymous questions, answered on Bluesky.",
        "url": "https://%APP_DOMAIN%",
        "applicationCategory": "SocialNetworking",
        "offers": {
          "@type": "Offer",
          "price": "0"
        },
        "operatingSystem": "All",
        "author": {
          "@type": "Person",
          "name": "%APP_NAME% Developer"
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
