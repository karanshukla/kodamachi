# Overlay: docker compose -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml up --build
# E2E_HANDLE and E2E_APP_PASSWORD come from the environment or docker/.env, not this file.

services:
  client:
    build:
      args:
        VITE_E2E_TESTING: "true"

  server:
    environment:
      NODE_ENV: "test"
      E2E_TESTING: "true"
      E2E_PDS_URL: "${E2E_PDS_URL:-https://bsky.social}"
      RATE_LIMIT_MAX: "0"

  caddy:
    ports:
      - "8090:80"
