services:

  # Anubis needs an upstream proxy to set X-Real-Ip (Railway's edge; DockerSmoke
  # sets it explicitly), so a plain browser here gets "[misconfiguration]". For
  # local dev use caddy directly.
  anubis:
    build: ../anubis
    ports:
      - "8080:8080"
    environment:
      BIND: :8080
      TARGET: http://caddy:80
    depends_on:
      caddy:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Anubis PINGs its store at boot, so an unreachable Valkey is a boot failure
  # (hence service_healthy). The alias exists because Anubis can't interpolate
  # env vars in its policy file (TecharoHQ/anubis#1152): the store URL is one
  # literal shared with production.
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      default:
        aliases:
          - valkey.railway.internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redirector:
    image: zappi/redirector
    ports:
      - "8081:8080"
    environment:
      REDIRECT_TARGET: "${PUBLIC_URL:-http://127.0.0.1:8080}/profile"
    restart: unless-stopped

  # Default local dev entry point: skips Anubis's PoW/X-Real-Ip check.
  caddy:
    build: ../caddy
    ports:
      - "8082:80"
    environment:
      PORT: 80
      FRONTEND_DOMAIN: opengraph-service
      FRONTEND_PORT: 8080
      BACKEND_DOMAIN: server
      BACKEND_PORT: 3000
      BACKEND_EU_DOMAIN: server
      BACKEND_EU_PORT: 3000
      BACKEND_NA_DOMAIN: server
      BACKEND_NA_PORT: 3000
    depends_on:
      - opengraph-service
      - server
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        VITE_API_URL: /api
        VITE_SHORTLINK_URL: "localhost:8081"
    restart: unless-stopped

  # Port 3000 is published because the loopback OAuth client redirects the
  # browser to http://127.0.0.1:3000/oauth/callback.
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Unset selects the loopback OAuth client format (valid for local/CI).
      PUBLIC_URL: "${PUBLIC_URL:-}"
      CLIENT_URL: "${PUBLIC_URL:-http://127.0.0.1:8080}"
      EXPORT_HTML_URL: http://html-to-image:3033/
      # Required by the env validator even when POSTGRESQL_URL is set.
      DB_PATH: ""
      OAUTH_TOKEN_SECRET: "${OAUTH_TOKEN_SECRET:?Set OAUTH_TOKEN_SECRET in .env (openssl rand -hex 32)}"
      COOKIE_SECRET: "${COOKIE_SECRET:?Set COOKIE_SECRET in .env (openssl rand -hex 32)}"
      POSTGRESQL_URL: "postgres://${POSTGRES_USER:-navyfragen}:${POSTGRES_PASSWORD:-navyfragen}@postgres:5432/${POSTGRES_DB:-navyfragen}"
    depends_on:
      postgres:
        condition: service_healthy
      html-to-image:
        condition: service_started
    restart: unless-stopped

  html-to-image:
    build:
      context: ..
      dockerfile: docker/Dockerfile.html-to-image
    # Chromium needs more than the default 64 MB /dev/shm.
    shm_size: "256m"
    restart: unless-stopped

  opengraph-service:
    build: ../opengraph-service
    environment:
      FRONTEND_URL: "http://client:3000"
      EXPORT_HTML_URL: "http://html-to-image:3033/"
      OG_CACHE_TTL: "720h"
      ATPROTO_APPVIEW_HOST: "https://api.bsky.app"
      NF_SERVER_URL: "http://server:3000"
      PUBLIC_URL: "${PUBLIC_URL:-https://kodamachi.app}"
      PORT: "8080"
    volumes:
      - og-image-cache:/data/og-cache
    depends_on:
      - client
      - html-to-image
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-navyfragen}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-navyfragen}"
      POSTGRES_DB: "${POSTGRES_DB:-navyfragen}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navyfragen}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  og-image-cache:
